[project]
name = "dance-focus"
version = "0.2.0"
description = "SAM 2 powered Linux desktop tool for reframing dance videos around a selected dancer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "PySide6>=6.8,<7",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
]

[project.scripts]
dance-focus = "dance_focus.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dance_focus"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
